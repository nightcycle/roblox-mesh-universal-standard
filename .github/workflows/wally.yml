name: Publish Wally
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: wally-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out publishing scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check out the tagged package separately
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          version: v1.2.0
      - name: Validate release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py validate "$TAG" release-source
          test "$(git -C release-source rev-parse "refs/tags/$TAG^{commit}")" = "$(git -C release-source rev-parse HEAD)"
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
      - name: Publish runtime
        env:
          WALLY_AUTH: ${{ secrets.WALLY_AUTH }}
        run: |
          python scripts/wally_auth.py "$HOME/.wally/auth.toml"
          wally publish --project-path release-source/mesh-runtime
      - name: Remove publishing credentials
        if: always()
        run: rm -f "$HOME/.wally/auth.toml"
