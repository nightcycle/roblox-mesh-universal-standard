name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  RELEASE_TAG: ${{ github.ref_name }}
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  binaries:
    needs: checks
    strategy:
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, platform: macos-x86_64 }
          - { os: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release.py validate "$RELEASE_TAG"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/release.py package "$RELEASE_TAG" ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: rmus-${{ matrix.platform }}
          path: dist/*.zip
  publish:
    needs: [checks, binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python scripts/release.py checksums dist
      - name: Publish versioned executable archives and demo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes dist/*
