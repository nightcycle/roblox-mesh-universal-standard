name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry, e.g. v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the release tag
        id: resolve
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
  binaries:
    needs: [prepare, checks]
    strategy:
      matrix:
        include:
          - { os: windows-2022, target: x86_64-pc-windows-msvc, platform: windows-x86_64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x86_64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, platform: macos-x86_64 }
          - { os: macos-15, target: aarch64-apple-darwin, platform: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/release.py validate "$RELEASE_TAG"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - run: python scripts/release.py package "$RELEASE_TAG" ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: rmus-${{ matrix.platform }}
          path: dist/*.zip
  publish:
    needs: [prepare, checks, binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: python scripts/release.py checksums dist
      - name: Publish versioned executable archives and demo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/*
          fi
