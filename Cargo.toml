[package]
name = "roblox-mesh-universal-standard"
version = "0.1.0"
edition = "2024"
description = "Versioned Roblox EditableMesh interchange and reconstruction"
license = "Apache-2.0"
repository = "https://github.com/nightcycle/roblox-mesh-universal-standard"

[[bin]]
name = "rmus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glam = "0.30"
rbx_binary = "3"
rbx_dom_weak = "4"
rbx_xml = "3"
rbx_mesh = "=0.7.0"
rbx_reflection_database = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ufbx = "=0.11.5"
base64 = "0.22"
binrw = "0.15"
draco-core = { version = "=2.3.2", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }

[dev-dependencies]
tempfile = "3"
draco-core = { version = "=2.3.2", default-features = false, features = ["encoder"] }
